name: CI + Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Habilitar GitHub Pages (idempotente)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Tests
        run: npm test
      - name: Build
        env:
          # El menú se snapshotea en build contra el endpoint real; si la var no
          # está definida o el endpoint falla, el build sigue con el fallback.
          # La URL /exec no es un secreto (el navegador la expone igual); la var
          # de repo permite override sin tocar código.
          PUBLIC_SHEETS_API_URL: ${{ vars.PUBLIC_SHEETS_API_URL || 'https://script.google.com/macros/s/AKfycbwruaySOwRQaUCZRgnp4jdno78wRKtqXCwtu8mcccKCAsIlqSy_1FwmKog21n_uafqx/exec' }}
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
